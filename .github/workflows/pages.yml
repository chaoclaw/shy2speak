name: Publish UI preview branch

on:
  push:
    branches:
      - codex/ui-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify caption processing
        run: python scripts/sync_youtube_captions.py --self-test

      - name: Validate course data
        run: node tests/data-contract.cjs

      - name: Assemble static preview
        run: |
          mkdir -p dist/data dist/icons
          cp index.html app.js backend.js styles.css runtime-config.js sw.js manifest.webmanifest dist/
          cp data/catalog.json dist/data/
          cp icons/icon.svg dist/icons/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          force_orphan: true
