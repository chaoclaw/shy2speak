name: Publish UI preview branch

on:
  push:
    branches:
      - codex/ui-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sync public YouTube captions
        run: |
          python -m pip install --disable-pip-version-check youtube-transcript-api==1.2.3 yt-dlp==2026.8.19
          python scripts/sync_youtube_captions.py
          node tests/data-contract.cjs

      - name: Write public runtime configuration
        env:
          SHY_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SHY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          node -e "const fs=require('fs');const c={supabaseUrl:process.env.SHY_SUPABASE_URL||'',supabasePublishableKey:process.env.SHY_SUPABASE_PUBLISHABLE_KEY||''};fs.writeFileSync('runtime-config.js','window.__SHY2SPEAK_CONFIG__ = Object.freeze('+JSON.stringify(c)+');\\n')"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          exclude_assets: '.github,node_modules'
