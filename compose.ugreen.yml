# 单文件直配模板：部署前必须分别替换下面两个值。
# 可运行两次 `openssl rand -hex 32` 生成数据库密码和认证密钥。
x-postgres-password: &postgres-password "CHANGE_ME_DATABASE_PASSWORD"
x-auth-secret: &auth-secret "CHANGE_ME_WITH_RANDOM_AUTH_SECRET_AT_LEAST_32_CHARS"

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shy2speak
      POSTGRES_USER: shy2speak
      POSTGRES_PASSWORD: *postgres-password
    volumes:
      - shy2speak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shy2speak", "-d", "shy2speak"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/chaoclaw/shy2speak:edge
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: shy2speak
      PGUSER: shy2speak
      PGPASSWORD: *postgres-password
      AUTH_SECRET: *auth-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: "30"
      TRUST_PROXY: "false"
      ALLOWED_ORIGINS: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMS_WEBHOOK_URL: ""
      SMS_WEBHOOK_TOKEN: ""
    ports:
      - "8080:8080"

volumes:
  shy2speak-postgres:
